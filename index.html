<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>طباعة بطاقات الأسعار - جسور</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #f8f9fa; 
            margin: 0; 
            padding: 20px; 
        }

        /* ------------------ شاشة تسجيل الدخول ------------------ */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .login-box {
            background: #ffffff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #ffe0b2;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .login-box h2 {
            color: #ff5722;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .login-group {
            display: flex;
            flex-direction: column;
            text-align: right;
            margin-bottom: 15px;
        }
        .login-group label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }
        .login-group input {
            padding: 10px;
            border: 1px solid #ffccbc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .login-group input:focus {
            border-color: #ff5722;
        }
        .login-btn {
            width: 100%;
            background: #ff5722;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }
        .login-btn:hover { background: #e64a19; }
        .login-error {
            color: #d32f2f;
            font-size: 13px;
            margin-bottom: 12px;
            display: none;
            font-weight: bold;
        }

        /* ------------------ واجهة التطبيق ------------------ */
        #appContent {
            display: none; /* مخفي لحين تسجيل الدخول */
        }

        .no-print { 
            background: #ffffff; 
            padding: 24px; 
            border-radius: 12px; 
            max-width: 850px; 
            margin: 0 auto 30px auto; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            border: 1px solid #ffe0b2;
        }
        .form-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        .form-group { 
            display: flex; 
            flex-direction: column; 
        }
        .form-group label { 
            font-size: 14px; 
            font-weight: bold; 
            margin-bottom: 6px; 
            color: #212529;
        }
        .form-group input { 
            padding: 10px; 
            border: 1px solid #ffccbc; 
            border-radius: 6px; 
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus {
            border-color: #ff5722;
        }
        .btn { 
            padding: 12px 20px; 
            border: none; 
            border-radius: 6px; 
            font-size: 15px;
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s;
        }
        .btn-add { 
            background: #ff5722; 
            color: white; 
        }
        .btn-add:hover { background: #e64a19; }
        .btn-print { 
            background: #2e7d32; 
            color: white; 
            margin-top: 10px; 
            width: 100%; 
            font-size: 17px; 
        }
        .btn-print:hover { background: #236627; }
        
        .print-container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
            justify-content: center; 
        }
        
        .card-container-box {
            position: relative;
            display: inline-block;
        }

        .card-actions {
            position: absolute;
            top: -12px;
            left: 5px;
            display: none;
            gap: 4px;
            z-index: 10;
        }
        .card-container-box:hover .card-actions {
            display: flex;
        }
        .action-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 2px 6px;
            font-size: 10px;
            cursor: pointer;
            border-radius: 3px;
        }
        .action-btn.edit { background: #0288d1; }
        .action-btn.delete { background: #d32f2f; }
        .action-btn:hover { opacity: 0.85; }

        .card-wrapper {
            position: relative; 
            width: 6cm; 
            height: 4cm; 
            background-color: #ffffff; 
            border-radius: 0; 
            padding: 36px 8px 6px 8px; 
            border: 1px solid #ffccbc; 
            box-sizing: border-box;
            page-break-inside: avoid;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header {
            position: absolute; 
            top: 0; 
            left: 0; 
            right: 0; 
            background: #ff5722; 
            color: #ffffff; 
            padding: 4px 8px; 
            font-size: 15px; 
            font-weight: 900; 
            text-align: right; 
            border-radius: 0; 
        }

        .card-main {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .card-code {
            text-align: right; 
            font-size: 21px; 
            color: #ff5722; 
            font-family: 'Courier New', Courier, monospace; 
            font-weight: 900; 
            letter-spacing: 0.5px;
            line-height: 1;
            margin-top: 4px; 
        }

        .card-title {
            text-align: right; 
            margin: 0; 
            color: #111111; 
            font-size: 14px; 
            font-weight: 900; 
            line-height: 1.15;
            max-height: 2.3em;
            overflow: hidden;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1.5px dashed #ffccbc;
            padding-top: 3px;
        }

        .card-origin {
            text-align: right; 
            font-size: 14.5px; 
            color: #111111; 
            font-weight: 900; 
            padding-bottom: 2px;
        }

        .card-prices {
            text-align: left; 
        }

        .old-price-value {
            color: #d32f2f; 
            font-size: 14px; 
            font-weight: 900; 
            display: block; 
            margin-bottom: 0px; 
            direction: ltr; 
            text-align: left;
        }

        .new-price-value {
            color: #ff5722; 
            font-size: 26px; 
            font-weight: 900; 
            line-height: 1; 
            direction: ltr; 
            text-align: left;
        }

        .card-prices.single-price {
            display: flex;
            align-items: center;
            height: 100%;
        }
        .card-prices.single-price .new-price-value {
            font-size: 30px;
        }

        /* إعدادات الطباعة للـ PDF */
        @media print {
            @page {
                margin: 0; 
            }
            #loginScreen { display: none !important; }
            .no-print { display: none !important; }
            .card-actions { display: none !important; }
            body { background: white; padding: 10px; }
            .print-container { 
                gap: 10px; 
                justify-content: flex-start;
            }
            .card-wrapper {
                box-shadow: none;
                border: 1px solid #ccc;
            }
            
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body>

    <!-- ================= شاشة تسجيل الدخول ================= -->
    <div id="loginScreen" class="login-wrapper">
        <div class="login-box">
            <h2>تسجيل الدخول - جسور</h2>
            <div id="loginError" class="login-error">اسم المستخدم أو كلمة المرور غير صحيحة!</div>
            <div class="login-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم" onkeydown="handleKeyDown(event)">
            </div>
            <div class="login-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" onkeydown="handleKeyDown(event)">
            </div>
            <button class="login-btn" onclick="login()">دخول</button>
        </div>
    </div>

    <!-- ================= محتوى التطبيق الرئيسي ================= -->
    <div id="appContent">
        <div class="no-print">
            <h2 style="margin-top:0; color:#ff5722;">منظومة بطاقات عرض الأسعار - جسور</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>اسم المنتج</label>
                    <input type="text" id="name" placeholder="سماعات لاسلكية احترافية">
                </div>
                <div class="form-group">
                    <label>الكود</label>
                    <input type="text" id="code" value="#CODE-JSR">
                </div>
                <div class="form-group">
                    <label>بلد المنشأ</label>
                    <input type="text" id="origin" value="الصين">
                </div>
                <div class="form-group">
                    <label>السعر السابق (ID) - اختياري</label>
                    <input type="text" id="oldPrice" placeholder="اتركه فارغاً إذا لم يوجد">
                </div>
                <div class="form-group">
                    <label>السعر الجديد (ID)</label>
                    <input type="text" id="newPrice" placeholder="99,000">
                </div>
                <div class="form-group">
                    <label>عدد النسخ المطلوبة</label>
                    <input type="number" id="qty" value="1" min="1">
                </div>
            </div>
            <button class="btn btn-add" onclick="addTag()">+ إضافة البطاقة للقائمة</button>
            <button class="btn btn-print" onclick="window.print()">طباعة الكل / حفظ كـ PDF</button>
        </div>

        <div class="print-container" id="container"></div>
    </div>

    <script>
        // --- منطق تسجيل الدخول ---
        function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('loginError');

            if (user === 'adminadmin' && pass === 'testtest') {
                errorDiv.style.display = 'none';
                
                // الاستعانة بـ try/catch لتجنب توقف الصفحة إذا كان المتصفح يحظر الجلسات المحلية
                try {
                    sessionStorage.setItem('jusoor_auth', 'true');
                } catch (e) {
                    console.warn('التخزين المحلي غير متاح، يتم متابعة الدخول مؤقتاً');
                }
                
                showApp();
            } else {
                errorDiv.style.display = 'block';
            }
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                login();
            }
        }

        function showApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
        }

        // التأكد من تسجيل الدخول السابق عند تحديث الصفحة
        window.onload = function() {
            try {
                if (sessionStorage.getItem('jusoor_auth') === 'true') {
                    showApp();
                }
            } catch (e) {
                // في حال حظر الجلسات، سيتم طلب تسجيل الدخول عادياً
            }
        };

        // --- منطق إدارة البطاقات ---
        function addTag() {
            const name = document.getElementById('name').value;
            const code = document.getElementById('code').value;
            const origin = document.getElementById('origin').value;
            const oldPrice = document.getElementById('oldPrice').value;
            const newPrice = document.getElementById('newPrice').value;
            const qty = parseInt(document.getElementById('qty').value) || 1;

            if(!name || !newPrice) {
                alert('يرجى إدخال اسم المنتج والسعر الجديد على الأقل');
                return;
            }

            const container = document.getElementById('container');

            for(let i=0; i < qty; i++) {
                createCardElement(container, name, code, origin, oldPrice, newPrice);
            }

            document.getElementById('name').value = '';
            document.getElementById('oldPrice').value = '';
            document.getElementById('newPrice').value = '';
        }

        function createCardElement(container, name, code, origin, oldPrice, newPrice) {
            const box = document.createElement('div');
            box.className = 'card-container-box';

            const actions = document.createElement('div');
            actions.className = 'card-actions';
            
            const editBtn = document.createElement('button');
            editBtn.className = 'action-btn edit';
            editBtn.innerText = 'تعديل';
            editBtn.onclick = function() {
                editCard(box, card);
            };

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'action-btn delete';
            deleteBtn.innerText = 'حذف';
            deleteBtn.onclick = function() {
                box.remove();
            };

            actions.appendChild(editBtn);
            actions.appendChild(deleteBtn);
            box.appendChild(actions);

            const card = document.createElement('div');
            card.className = 'card-wrapper';
            
            updateCardContent(card, name, code, origin, oldPrice, newPrice);
            box.appendChild(card);
            container.appendChild(box);
        }

        function updateCardContent(card, name, code, origin, oldPrice, newPrice) {
            let pricesHTML = '';
            let pricesClass = 'card-prices';

            if(oldPrice && oldPrice.trim() !== '') {
                pricesHTML = `
                    <del class="old-price-value">
                        ${oldPrice}<span style="font-size: 12px; font-weight: 900;">ID</span>
                    </del>
                    <div class="new-price-value">
                        ${newPrice}<span style="font-size: 15px; font-weight: 900;">ID</span>
                    </div>
                `;
            } else {
                pricesClass += ' single-price';
                pricesHTML = `
                    <div class="new-price-value">
                        ${newPrice}<span style="font-size: 18px; font-weight: 900;">ID</span>
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="card-header">جسور</div>
                <div class="card-main">
                    <div class="card-code">${code}</div>
                    <h3 class="card-title">${name}</h3>
                </div>
                <div class="card_bottom card-bottom">
                    <div class="card-origin">المنشأ: ${origin}</div>
                    <div class="${pricesClass}">
                        ${pricesHTML}
                    </div>
                </div>
            `;
        }

        function editCard(box, card) {
            const currentTitle = card.querySelector('.card-title').innerText;
            const currentCode = card.querySelector('.card-code').innerText;
            const currentOriginText = card.querySelector('.card-origin').innerText;
            const currentOrigin = currentOriginText.replace('المنشأ: ', '').trim();
            
            const oldDel = card.querySelector('.old-price-value');
            let currentOld = '';
            if (oldDel) {
                currentOld = oldDel.innerText.replace('ID', '').trim();
            }
            
            const newPriceDiv = card.querySelector('.new-price-value');
            const currentNew = newPriceDiv.innerText.replace('ID', '').trim();

            const newNameVal = prompt('تعديل اسم المنتج:', currentTitle);
            if (newNameVal === null) return;

            const newCodeVal = prompt('تعديل الكود:', currentCode);
            const newOriginVal = prompt('تعديل بلد المنشأ:', currentOrigin);
            const newOldVal = prompt('تعديل السعر السابق (اتركه فارغاً إذا لم يوجد):', currentOld);
            const newNewVal = prompt('تعديل السعر الجديد:', currentNew);

            if (!newNameVal || !newNewVal) {
                alert('اسم المنتج والسعر الجديد حقلان إجباريان!');
                return;
            }

            updateCardContent(card, newNameVal, newCodeVal, newOriginVal, newOldVal, newNewVal);
        }
    </script>
</body>
</html>
